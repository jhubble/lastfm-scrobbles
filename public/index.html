<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Last.fm Scrobble Dashboard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121214;
      color: #e1e1e6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      color: #e5151f;
      margin-bottom: 20px;
    }
    .card {
      background: #202024;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    input {
      background: #121214;
      border: 1px solid #323238;
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      flex: 1;
      min-width: 200px;
    }
    input:focus {
      outline: none;
      border-color: #e5151f;
    }
    button {
      background: #e5151f;
      border: none;
      color: white;
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background: #b81018;
    }
    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #29292e;
      color: #e1e1e6;
      border: 1px solid #3e3e44;
    }
    .btn-secondary:hover {
      background: #38383e;
    }
    .btn-warning {
      background: #d97706;
      color: #fff;
    }
    .btn-warning:hover {
      background: #b45309;
    }
    .btn-small {
      padding: 6px 12px;
      font-size: 13px;
    }

    /* Resume Banner */
    .resume-banner {
      background: #292215;
      border: 1px solid #d97706;
      color: #fef3c7;
      border-radius: 6px;
      padding: 12px 16px;
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .resume-text {
      font-size: 14px;
    }
    .resume-actions {
      display: flex;
      gap: 8px;
    }

    /* Progress Box */
    .progress-box {
      background: #18181c;
      border: 1px solid #323238;
      border-radius: 8px;
      padding: 16px;
      margin-top: 15px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-title {
      font-weight: 600;
      font-size: 14px;
      color: #fff;
    }
    .progress-badge {
      background: #e5151f;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
    }
    .progress-bar-bg {
      background: #29292e;
      border-radius: 6px;
      height: 12px;
      width: 100%;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #e5151f, #ff4f5a);
      height: 100%;
      width: 0%;
      transition: width 0.25s ease;
      border-radius: 6px;
    }
    .progress-details {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #a8a8b3;
    }
    .progress-controls {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .status {
      margin-top: 10px;
      font-style: italic;
      color: #a8a8b3;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .stat-box {
      background: #29292e;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
    }
    .stat-val {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      margin-top: 5px;
    }
    ul {
      list-style: none;
      padding: 0;
      max-height: 350px;
      overflow-y: auto;
    }
    li {
      border-bottom: 1px solid #323238;
      padding: 8px 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 Last.fm Scrobble Dashboard</h1>
    
    <div class="card">
      <div class="controls">
        <input type="text" id="username" placeholder="Enter Last.fm Username" autocomplete="off">
        <button id="btnFetch" onclick="fetchLocalData()">Load Scrobbles</button>
        <button id="btnDownload" onclick="downloadAll({ resume: true })">Download All</button>
        <button id="btnSync" onclick="syncNewer()">Fetch Newer</button>
        <button id="btnRestart" class="btn-secondary" onclick="restartDownload()" style="display: none;">Restart From Beginning</button>
      </div>

      <!-- Partial download notification banner -->
      <div id="resumeBanner" class="resume-banner" style="display: none;">
        <div class="resume-text" id="resumeText">
          ⚠️ Partially completed download detected.
        </div>
        <div class="resume-actions">
          <button class="btn-warning btn-small" onclick="downloadAll({ resume: true })">Resume Download</button>
          <button class="btn-secondary btn-small" onclick="restartDownload()">Restart</button>
        </div>
      </div>

      <!-- Live download progress box -->
      <div id="progressBox" class="progress-box" style="display: none;">
        <div class="progress-header">
          <span class="progress-title" id="progressTitle">Downloading scrobbles...</span>
          <span class="progress-badge" id="progressBadge">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progressBarFill" class="progress-bar-fill"></div>
        </div>
        <div class="progress-details">
          <span id="progressDetails">Preparing download...</span>
          <span id="progressSaveIndicator">💾 Incremental disk sync</span>
        </div>
        <div class="progress-controls">
          <button id="btnPause" class="btn-secondary btn-small" onclick="pauseDownload()">Pause Download</button>
        </div>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div class="grid" id="statsGrid">
      <div class="stat-box">Total Scrobbles<div class="stat-val" id="stTotal">-</div></div>
      <div class="stat-box">First Scrobble<div class="stat-val" style="font-size: 14px;" id="stFirst">-</div></div>
      <div class="stat-box">Last Scrobble<div class="stat-val" style="font-size: 14px;" id="stLast">-</div></div>
      <div class="stat-box">Scrobbles / Month<div class="stat-val" id="stRate">-</div></div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h2>Recent Scrobbles</h2>
      <ul id="scrobbleList"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
