<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listening Details · Last.fm Scrobbles</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #121214; color: #e1e1e6; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1100px; margin: auto; }
    a { color: #ff6870; }
    h1 { color: #e5151f; margin: 16px 0 4px; overflow-wrap: anywhere; }
    h2 { font-size: 19px; margin: 0 0 12px; }
    .muted { color: #a8a8b3; }
    .card { background: #202024; padding: 20px; border-radius: 8px; margin: 16px 0; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
    .stat { background: #29292e; padding: 14px; border-radius: 6px; color: #a8a8b3; }
    .stat strong { display: block; color: #fff; font-size: 18px; margin-top: 5px; }
    .related-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .related { min-width: 0; width: 100%; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #323238; vertical-align: top; }
    th { color: #a8a8b3; font-size: 12px; }
    .sort-button { appearance: none; background: none; border: 0; color: inherit; font: inherit; font-weight: 600; padding: 0; cursor: pointer; text-align: left; }
    .sort-button:hover { color: #ff6870; }
    td:first-child { overflow-wrap: anywhere; }
    .related-items a { display: block; padding: 2px 0; }
    .count { white-space: nowrap; color: #a8a8b3; }
    .loading { margin: 15px 0; padding: 14px; background: #202024; border-radius: 8px; }
    .empty { color: #a8a8b3; padding: 12px 0; }
    @media (max-width: 600px) { body { padding: 14px; } .card { padding: 15px; } th, td { padding: 8px 5px; font-size: 13px; } }
  </style>
</head>
<body>
  <main>
    <a href="analysis.html" id="backLink">← Back to analysis</a>
    <div id="loading" class="loading" role="status">Loading listening details…</div>
    <div id="content" hidden>
      <div class="muted" id="kindLabel"></div>
      <h1 id="title"></h1>
      <div class="muted" id="subtitle"></div>
      <section class="card">
        <h2>Listening history</h2>
        <div class="stats" id="stats"></div>
      </section>
      <div class="related-grid" id="related"></div>
    </div>
  </main>
  <script src="detail.js"></script>
</body>
</html>
