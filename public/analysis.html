<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Listening Analysis · Last.fm Scrobbles</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #121214; color: #e1e1e6; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1100px; margin: auto; }
    h1 { color: #e5151f; margin: 18px 0 6px; }
    h2 { font-size: 19px; margin: 0 0 12px; }
    .muted { color: #a8a8b3; }
    .card { background: #202024; padding: 20px; border-radius: 8px; margin: 16px 0; }
    .toolbar, .quick-links, .period-links { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .toolbar { margin: 16px 0; }
    button, input { background: #29292e; color: #eee; border: 1px solid #42424a; border-radius: 5px; padding: 9px 12px; }
    button { cursor: pointer; font-weight: 600; }
    button:hover, button.active { background: #e5151f; border-color: #e5151f; }
    input[type="number"] { width: 82px; }
    .period-links { margin-top: 14px; }
    .period-links strong { width: 100%; font-size: 13px; color: #a8a8b3; }
    .rankings { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 16px; }
    .ranking { background: #202024; border-radius: 8px; padding: 18px; min-width: 0; }
    ol { list-style: none; counter-reset: rank; margin: 0; padding: 0; }
    li { counter-increment: rank; border-bottom: 1px solid #323238; padding: 10px 0; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; }
    li::before { content: counter(rank); color: #85858f; font-variant-numeric: tabular-nums; }
    .name { overflow-wrap: anywhere; }
    .plays { color: #a8a8b3; white-space: nowrap; font-size: 13px; }
    .empty { color: #a8a8b3; }
    @media (max-width: 600px) { body { padding: 14px; } .card { padding: 15px; } }
  </style>
</head>
<body>
  <main>
    <a class="muted" href="/">← Back to dashboard</a>
    <h1>Listening Analysis</h1>
    <div id="summary" class="muted">Loading scrobbles…</div>
    <section class="card">
      <div class="quick-links" id="quickLinks" aria-label="Quick time ranges"></div>
      <div class="period-links" id="monthLinks"></div>
      <div class="period-links" id="yearLinks"></div>
      <div class="toolbar">
        <label for="startDate">Custom range</label>
        <input type="date" id="startDate" aria-label="Start date">
        <span>to</span>
        <input type="date" id="endDate" aria-label="End date">
        <button id="applyRange">Apply</button>
        <label for="itemLimit">Items per list</label>
        <input type="number" id="itemLimit" min="1" max="500" value="25">
        <button id="applyLimit">Update</button>
      </div>
    </section>
    <div class="rankings">
      <section class="ranking"><h2>Top Tracks</h2><ol id="tracks"></ol></section>
      <section class="ranking"><h2>Top Albums</h2><ol id="albums"></ol></section>
      <section class="ranking"><h2>Top Artists</h2><ol id="artists"></ol></section>
    </div>
  </main>
  <script src="analysis.js"></script>
</body>
</html>
